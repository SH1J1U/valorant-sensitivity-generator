<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="refresh" content="0; url=index_v0.3.html">
  <link rel="canonical" href="index_v0.3.html">
  <title>VAL // SENS LAB · 进入中</title>
  <style>
    :root{--red:#ff4655;--mint:#91ffd0;--muted:#92a5ab;--bg:#071014}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 80% 0,rgba(255,70,85,.1),transparent 30%),linear-gradient(180deg,#071014,#09161b 55%,#061014);
      color:#f3efe8;font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif;text-align:center}
    .box{padding:40px 34px;border:1px solid #263a41;background:linear-gradient(145deg,rgba(17,37,44,.91),rgba(10,23,28,.94));
      box-shadow:0 24px 70px rgba(0,0,0,.34);max-width:440px}
    .kicker{color:var(--red);font-size:11px;letter-spacing:.2em;font-weight:900;margin:0 0 14px}
    h1{margin:0 0 14px;font-size:30px;letter-spacing:-.035em}
    p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.7}
    a.btn{display:inline-block;padding:13px 22px;background:var(--red);color:#fff;font-weight:800;
      text-decoration:none;transition:transform .16s cubic-bezier(.16,.84,.3,1),filter .16s}
    a.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .bar{height:3px;margin:24px auto 0;width:180px;background:#26383e;overflow:hidden}
    .bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,var(--red),var(--mint));
      animation:run 1.1s cubic-bezier(.16,.84,.3,1) infinite}
    @keyframes run{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    @media (prefers-reduced-motion:reduce){.bar i{animation-duration:.001ms!important;width:100%}}
  </style>
</head>
<body>
  <div class="box">
    <p class="kicker">VAL // SENS LAB</p>
    <h1>正在进入瞄准实验室</h1>
    <p>如果没有自动跳转，点下面的按钮。</p>
    <a class="btn" href="index_v0.3.html">进入 v0.3</a>
    <div class="bar"><i></i></div>
  </div>
  <script>location.replace("index_v0.3.html");</script>
</body>
</html>
